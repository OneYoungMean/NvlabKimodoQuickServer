name: notify-bridge-sync

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      quickserver_ref:
        description: Ref/branch/tag to ask KimodoUnityBridge to sync
        required: false
        default: main

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve sync ref
        id: sync_ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.quickserver_ref }}" ]; then
            echo "value=${{ github.event.inputs.quickserver_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify KimodoUnityBridge
        env:
          DISPATCH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "CROSS_REPO_TOKEN is not configured; skipping cross-repo dispatch."
            echo "Configure CROSS_REPO_TOKEN to enable immediate syncs."
            exit 0
          fi

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/OneYoungMean/KimodoUnityBridge/dispatches \
            -d @- <<'JSON'
          {
            "event_type": "sync-quickserver",
            "client_payload": {
              "quickserver_ref": "${{ steps.sync_ref.outputs.value }}",
              "source_repository": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}",
              "source_ref_name": "${{ github.ref_name }}"
            }
          }
          JSON

      - name: Write summary
        shell: bash
        run: |
          {
            echo "Requested QuickServer ref: ${{ steps.sync_ref.outputs.value }}"
            if [ -n "${{ secrets.CROSS_REPO_TOKEN }}" ]; then
              echo "Dispatch mode: immediate cross-repo trigger"
            else
              echo "Dispatch mode: skipped because CROSS_REPO_TOKEN is missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
